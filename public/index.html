<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>QVAC — Local AI</title>
  <link rel="icon" type="image/svg+xml" href="/qvac-logo.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="app-layout">

    <!-- Минималистичный левый сайдбар (история диалогов) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a class="brand" href="/">
          <img src="/qvac-logo.svg" alt="QVAC Logo" class="brand-logo">
        </a>
        <button class="icon-btn-ghost" id="toggleSidebarBtn" title="Скрыть панель">✕</button>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <span>+</span> Новый чат
      </button>

      <div class="sessions-nav">
        <div class="sessions-label">Недавние диалоги</div>
        <div class="sessions-list" id="sessionsList">
          <!-- Рендерится через app.js -->
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span id="nodeStatusText">Локальный узел активен</span>
        </div>
        <button class="footer-btn" id="openSettingsBtn" title="Настройки">
          ⚙️ Настройки
        </button>
      </div>
    </aside>

    <!-- Основная рабочая область (Фокус на диалоге) -->
    <main class="main-content">

      <!-- Верхняя аккуратная полоска -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn-ghost" id="openSidebarBtn" title="Показать меню" style="display:none;">
            ☰
          </button>
          <div class="model-pill">
            <span class="model-dot"></span>
            <span id="activeModelName">llama-3.2-3b</span>
          </div>
        </div>

        <div class="topbar-right">
          <button class="action-btn" id="clearChatBtn" title="Очистить переписку">
            Очистить
          </button>
        </div>
      </header>

      <!-- Лента переписки -->
      <div class="chat-container" id="chatFeed">
        <!-- Сообщения или экран приветствия -->
      </div>

      <!-- Просторная строка ввода в стиле современных ИИ (Claude / ChatGPT) -->
      <div class="input-wrapper">
        <div class="input-card">
          <!-- Полоска прикрепленных файлов -->
          <div class="attachments-strip" id="attachmentStrip"></div>

          <!-- Индикатор записи голоса -->
          <div class="recording-bar" id="recordingBar" style="display:none;">
            <span class="recording-pulse-dot"></span>
            <span class="recording-label">Идет запись голоса... Говорите в микрофон</span>
            <button type="button" class="stop-rec-btn" id="stopRecBtn" title="Остановить запись">Готово ✓</button>
          </div>

          <div class="input-row">
            <!-- Поле ввода вопроса (максимум пространства) -->
            <textarea
              id="chatInput"
              class="chat-textarea"
              placeholder="Спросите что-нибудь..."
              rows="1"
            ></textarea>

            <!-- Правая группа: Мини-логотип с меню действий + Кнопка отправки -->
            <div class="input-actions-right">
              <!-- Скрытый инпут для выбора файлов -->
              <input type="file" id="fileHiddenInput" style="display:none;" accept="image/*,.pdf,.txt,.md,.json,.csv">

              <!-- Мини-логотип с выпадающим меню действий -->
              <div class="mini-logo-menu-wrapper" id="miniLogoMenuWrapper">
                <button
                  type="button"
                  class="mini-logo-btn"
                  id="miniLogoBtn"
                  title="Инструменты QVAC (файлы, OCR, голос)"
                  aria-label="Инструменты QVAC"
                  aria-haspopup="true"
                  aria-expanded="false"
                >
                  <svg class="mini-logo-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8" fill="rgba(0, 210, 170, 0.12)"/>
                    <path d="M7 8H17V10H13.2V16.5H10.8V10H7V8Z" fill="currentColor"/>
                    <ellipse cx="12" cy="12.5" rx="5.5" ry="1.8" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
                  </svg>
                </button>

                <!-- Всплывающее меню действий по клику на мини-логотип -->
                <div class="mini-logo-popover" id="miniLogoPopover">
                  <div class="popover-header">
                    <span class="popover-badge">QVAC</span>
                    <span class="popover-subtitle">Инструменты модели</span>
                  </div>

                  <div class="popover-list">
                    <button type="button" class="popover-item" id="menuAttachDocBtn">
                      <div class="popover-icon-box">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                          <polyline points="14 2 14 8 20 8"></polyline>
                          <line x1="16" y1="13" x2="8" y2="13"></line>
                          <line x1="16" y1="17" x2="8" y2="17"></line>
                        </svg>
                      </div>
                      <div class="popover-text">
                        <span class="popover-title">Прикрепить документ</span>
                        <span class="popover-desc">PDF, TXT, MD для контекста</span>
                      </div>
                    </button>

                    <button type="button" class="popover-item" id="menuAttachImgBtn">
                      <div class="popover-icon-box">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                          <circle cx="8.5" cy="8.5" r="1.5"></circle>
                          <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                      </div>
                      <div class="popover-text">
                        <span class="popover-title">Распознать фото / скан</span>
                        <span class="popover-desc">Florence-2 OCR извлечение текста</span>
                      </div>
                    </button>

                    <button type="button" class="popover-item" id="menuMicBtn">
                      <div class="popover-icon-box mic-box" id="menuMicIconBox">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                          <line x1="12" y1="19" x2="12" y2="23"></line>
                          <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                      </div>
                      <div class="popover-text">
                        <span class="popover-title" id="menuMicTitle">Голосовой ввод</span>
                        <span class="popover-desc" id="menuMicDesc">Whisper STT диктовка</span>
                      </div>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Кнопка отправки сообщения -->
              <button class="send-btn" id="sendBtn" title="Отправить сообщение" aria-label="Отправить">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="19" x2="12" y2="5"></line>
                  <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="input-subtext">
          Tether QVAC — локальная приватная модель на вашем устройстве
        </div>
      </div>

    </main>

  </div>

  <!-- Простое всплывающее окно настроек -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-box">
      <div class="modal-top">
        <h3>Настройки QVAC</h3>
        <button class="close-btn" id="closeSettingsBtn">✕</button>
      </div>
      <div class="modal-content">
        <label class="setting-label">Адрес сервера QVAC</label>
        <input type="text" class="setting-input" id="cfgApiBase" placeholder="http://127.0.0.1:8085">

        <label class="setting-label" style="margin-top:14px;">Источник локальной LLM</label>
        <select class="setting-input" id="cfgBackend">
          <option value="auto">⚡ Автоопределение (QVAC Native + LM Studio + Ollama)</option>
          <option value="native">⚡ QVAC Native Engine (Metal MPS / CPU TurboQuant)</option>
          <option value="ollama">🦙 Ollama (http://127.0.0.1:11434/v1)</option>
          <option value="lmstudio">🟣 LM Studio (http://127.0.0.1:1234/v1)</option>
          <option value="custom">🌐 Пользовательский URL</option>
        </select>

        <div id="customLlmRow" style="margin-top:12px; display:none;">
          <label class="setting-label">URL локальной LLM</label>
          <input type="text" class="setting-input" id="cfgCustomLlm" placeholder="http://127.0.0.1:11434/v1">
        </div>

        <div style="margin-top:12px; display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <button type="button" class="test-conn-btn" id="checkConnBtn">🔍 Проверить статус LLM</button>
          <span id="connStatusText" style="font-size:0.75rem; color:var(--text-muted); text-align:right;">Готово к проверке</span>
        </div>

        <label class="setting-label" style="margin-top:14px;">Системный промпт</label>
        <textarea class="setting-textarea" id="systemPromptInput" rows="3"></textarea>
      </div>
      <div class="modal-bottom">
        <button class="save-btn" id="saveSettingsBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Уведомления -->
  <div class="toast-box" id="toastContainer"></div>

  <script src="/app.js"></script>
</body>
</html>
