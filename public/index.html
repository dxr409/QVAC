<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>QVAC — Local AI</title>
  <link rel="icon" type="image/svg+xml" href="/qvac-logo.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="app-layout">

    <!-- Минималистичный левый сайдбар (история диалогов) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a class="brand" href="/">
          <img src="/qvac-logo.svg" alt="QVAC Logo" class="brand-logo">
        </a>
        <button class="icon-btn-ghost" id="toggleSidebarBtn" title="Скрыть панель">✕</button>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <span>+</span> Новый чат
      </button>

      <div class="sessions-nav">
        <div class="sessions-label">Недавние диалоги</div>
        <div class="sessions-list" id="sessionsList">
          <!-- Рендерится через app.js -->
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span id="nodeStatusText">Локальный узел активен</span>
        </div>
        <button class="footer-btn" id="openSettingsBtn" title="Настройки">
          ⚙️ Настройки
        </button>
      </div>
    </aside>

    <!-- Основная рабочая область (Фокус на диалоге) -->
    <main class="main-content">

      <!-- Верхняя аккуратная полоска -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn-ghost" id="openSidebarBtn" title="Показать меню" style="display:none;">
            ☰
          </button>
          <div class="model-pill">
            <span class="model-dot"></span>
            <span id="activeModelName">llama-3.2-3b</span>
          </div>
        </div>

        <div class="topbar-right">
          <button class="action-btn" id="clearChatBtn" title="Очистить переписку">
            Очистить
          </button>
        </div>
      </header>

      <!-- Лента переписки -->
      <div class="chat-container" id="chatFeed">
        <!-- Сообщения или экран приветствия -->
      </div>

      <!-- Плавающая строка ввода (как в современных AI чатах) -->
      <div class="input-wrapper">
        <div class="input-card">
          <!-- Полоска прикрепленных файлов (если загружено фото или документ) -->
          <div class="attachments-strip" id="attachmentStrip"></div>

          <!-- Индикатор записи голоса -->
          <div class="recording-bar" id="recordingBar" style="display:none;">
            <span class="recording-pulse-dot"></span>
            <span>Идет запись голоса... Говорите в микрофон</span>
          </div>

          <div class="input-row">
            <!-- Кнопка прикрепить файл (фото для OCR или документ для RAG) -->
            <button class="tool-btn" id="attachFileBtn" title="Прикрепить фото (OCR) или документ (RAG)">
              📎
            </button>
            <input type="file" id="fileHiddenInput" style="display:none;" accept="image/*,.pdf,.txt,.md,.json,.csv">

            <!-- Кнопка голосового ввода -->
            <button class="tool-btn" id="micBtn" title="Голосовой ввод">
              🎙️
            </button>

            <!-- Поле ввода вопроса -->
            <textarea
              id="chatInput"
              class="chat-textarea"
              placeholder="Спросите что-нибудь, прикрепите фото или файл..."
              rows="1"
            ></textarea>

            <!-- Кнопка отправки -->
            <button class="send-btn" id="sendBtn" title="Отправить сообщение">
              ↑
            </button>
          </div>
        </div>
        <div class="input-subtext">
          Tether QVAC работает локально на вашем устройстве без облачных серверов
        </div>
      </div>

    </main>

  </div>

  <!-- Простое всплывающее окно настроек -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-box">
      <div class="modal-top">
        <h3>Настройки QVAC</h3>
        <button class="close-btn" id="closeSettingsBtn">✕</button>
      </div>
      <div class="modal-content">
        <label class="setting-label">Адрес сервера QVAC</label>
        <input type="text" class="setting-input" id="cfgApiBase" placeholder="http://127.0.0.1:8085">

        <label class="setting-label" style="margin-top:14px;">Источник локальной LLM</label>
        <select class="setting-input" id="cfgBackend">
          <option value="auto">⚡ Автоопределение (QVAC Native + LM Studio + Ollama)</option>
          <option value="native">⚡ QVAC Native Engine (Metal MPS / CPU TurboQuant)</option>
          <option value="ollama">🦙 Ollama (http://127.0.0.1:11434/v1)</option>
          <option value="lmstudio">🟣 LM Studio (http://127.0.0.1:1234/v1)</option>
          <option value="custom">🌐 Пользовательский URL</option>
        </select>

        <div id="customLlmRow" style="margin-top:12px; display:none;">
          <label class="setting-label">URL локальной LLM</label>
          <input type="text" class="setting-input" id="cfgCustomLlm" placeholder="http://127.0.0.1:11434/v1">
        </div>

        <div style="margin-top:12px; display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <button type="button" class="test-conn-btn" id="checkConnBtn">🔍 Проверить статус LLM</button>
          <span id="connStatusText" style="font-size:0.75rem; color:var(--text-muted); text-align:right;">Готово к проверке</span>
        </div>

        <label class="setting-label" style="margin-top:14px;">Системный промпт</label>
        <textarea class="setting-textarea" id="systemPromptInput" rows="3"></textarea>
      </div>
      <div class="modal-bottom">
        <button class="save-btn" id="saveSettingsBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Уведомления -->
  <div class="toast-box" id="toastContainer"></div>

  <script src="/app.js"></script>
</body>
</html>
